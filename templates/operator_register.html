{% extends "layout.html" %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 24px; color: var(--accent-blue);">Operator Register</h2>
        <form action="{{ url_for('operator_register') }}" method="post">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" required>
            </div>
            <button type="submit" class="btn btn-secondary btn-block">Register</button>
        </form>
        <p style="text-align: center; margin-top: 16px;">
            Already have an account? <a href="{{ url_for('operator_login') }}" style="color: var(--accent-blue);">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
