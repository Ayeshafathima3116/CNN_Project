{% extends "layout.html" %}
{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2 style="margin-bottom: 24px; color: var(--accent-green);">Add New Passenger</h2>
        <form action="{{ url_for('add_passenger') }}" method="post">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label required">Passenger ID</label>
                    <input type="text" name="pid" class="form-input" required placeholder="P001">
                </div>
                <div class="form-group">
                    <label class="form-label required">Full Name</label>
                    <input type="text" name="name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Age</label>
                    <input type="number" name="age" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Contact</label>
                    <input type="text" name="contact" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">NID / Passport</label>
                    <input type="text" name="nid" class="form-input">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-textarea" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="Clear" style="color: var(--success-color);">Clear</option>
                    <option value="Wanted" style="color: var(--error-color);">Wanted / Suspect</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn btn-primary">Save Passenger</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
